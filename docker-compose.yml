version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: mtbrescue-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mtbrescue
    ports:
      - "5432:5432"
    volumes:
      - mtbrescue-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  mtbrescue-data:
